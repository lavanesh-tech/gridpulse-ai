spring:
  ai:
    # Spring AI model selection. "none" keeps OpenAI off (no key needed); set SPRING_AI_MODEL_CHAT and
    # SPRING_AI_MODEL_EMBEDDING to "openai" together with OPENAI_API_KEY to enable the real models.
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small
  application:
    name: gridpulse-ai
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:gridpulse}
    username: ${POSTGRES_USER:gridpulse}
    password: ${POSTGRES_PASSWORD:change-me-locally}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness for the container platform
      show-details: when-authorized
      roles: ADMIN
  metrics:
    tags:
      application: gridpulse-ai
    distribution:
      percentiles-histogram:
        http.server.requests: true
        gridpulse.schedule.compute: true
logging:
  pattern:
    # every log line carries the request id (also returned to the client as X-Request-Id)
    level: "%5p [%X{requestId:-}]"
gridpulse:
  security:
    # HS256 signing key, >= 32 bytes. Supply via environment; never commit a real value.
    jwt-secret: ${GRIDPULSE_JWT_SECRET:}
    issuer: gridpulse-ai
    token-ttl: 1h
    requests-per-minute: ${GRIDPULSE_RATE_LIMIT_PER_MINUTE:120}
    login-requests-per-minute: ${GRIDPULSE_LOGIN_RATE_LIMIT_PER_MINUTE:10}
  bootstrap:
    # If set and no users exist, creates a demo tenant and an ADMIN user on startup (local use only).
    admin-username: ${GRIDPULSE_ADMIN_USERNAME:admin}
    admin-password: ${GRIDPULSE_ADMIN_PASSWORD:}
  ai:
    # Embeddings: "auto" uses the configured embedding model if any, else the offline lexical embedder.
    embeddings: ${GRIDPULSE_AI_EMBEDDINGS:auto}
    retrieval-top-k: 5
    # measured: 0.10 let 14% of random off-topic queries through (hash collisions); 0.20 lets 0.12%
    min-score-lexical: 0.20
    min-score-model: 0.30
springdoc:
  swagger-ui:
    path: /swagger-ui.html
