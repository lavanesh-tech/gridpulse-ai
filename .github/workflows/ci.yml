# Runs on every push and pull request. No deployment and no cloud credentials: build, test, package.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + coverage gate)
    runs-on: ubuntu-24.04   # pinned: Playwright 1.56 cannot install browser deps on Ubuntu 26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      # Testcontainers uses the runner's Docker for Postgres and Kafka.
      - run: ./gradlew build --no-daemon
      - name: Test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
            notification-service/build/reports/tests/
            mcp-server/build/reports/tests/
          retention-days: 14

  frontend:
    name: Frontend (unit tests + build)
    runs-on: ubuntu-24.04   # pinned: Playwright 1.56 cannot install browser deps on Ubuntu 26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser end-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-24.04   # pinned: Playwright 1.56 cannot install browser deps on Ubuntu 26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./scripts/e2e.sh
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            build/app-*.log
          retention-days: 14

  images:
    name: Docker images
    needs: [backend, frontend]
    runs-on: ubuntu-24.04   # pinned: Playwright 1.56 cannot install browser deps on Ubuntu 26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build API, notification and web images
        run: docker compose --profile app build
