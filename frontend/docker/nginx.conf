server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # advisor answers can take a while
    }

    # hashed build assets never change: cache them for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # single-page app: unknown paths (e.g. /planner) are served index.html and routed in the browser
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
